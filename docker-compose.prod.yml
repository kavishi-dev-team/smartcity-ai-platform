services:
  mysql:
    image: mysql:8.0
    container_name: smartcity-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartcity_db}
      MYSQL_USER: ${MYSQL_USER:-smartcity_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartcity-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smartcity_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smartcity_db}
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2-alpine
    container_name: smartcity-caddy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
