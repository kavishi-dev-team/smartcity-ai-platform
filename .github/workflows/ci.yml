name: Smart City Platform CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI & Pytest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot123
          MYSQL_DATABASE: smart_city_db
          MYSQL_USER: smartcity_user
          MYSQL_PASSWORD: smartcity123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python bytecode
        run: python -m compileall -q backend/app backend/tests

      - name: Run Pytest test suite
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://smartcity_user:smartcity123@127.0.0.1:3306/smart_city_db
          SECRET_KEY: ci-environment-test-secret-key-32charsmin
          DEBUG: "false"
        run: |
          PYTHONPATH=. pytest -v

      - name: Verify FastAPI application initialization
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://smartcity_user:smartcity123@127.0.0.1:3306/smart_city_db
          SECRET_KEY: ci-environment-test-secret-key-32charsmin
        run: python -c "from app.main import app; print('FastAPI application initialized successfully')"

  frontend:
    name: Frontend (Flutter Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: frontend/smart_city_app
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: frontend/smart_city_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        working-directory: frontend/smart_city_app
        run: flutter test

      - name: Build Flutter Web release
        working-directory: frontend/smart_city_app
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.smartcity.local

  docker:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f .env.docker ]; then
            cp .env.example .env.docker
          fi
          docker compose config

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t smartcity-backend:ci .
